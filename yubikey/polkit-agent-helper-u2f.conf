# Drop-in for polkit-agent-helper@.service, so YubiKey (pam_u2f) works in
# PolicyKit prompts (KDE Discover updates, pkexec, ...).
# Installed to /etc/systemd/system/polkit-agent-helper@.service.d/u2f.conf
#
# The stock unit sandboxes the helper: PrivateDevices=yes and
# DevicePolicy=strict hide the YubiKey (/dev/hidraw*) and /dev/urandom
# (pam_u2f needs it to generate the challenge: "Failed to generate challenge").
# ProtectHome=yes also hides ~/.config/Yubico/u2f_keys, which is why the
# PAM profile uses authfile=/etc/Yubico/u2f_keys instead.
[Service]
PrivateDevices=no
DeviceAllow=char-hidraw rw
DeviceAllow=/dev/urandom r
DeviceAllow=/dev/random r
